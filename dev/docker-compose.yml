services:
  backend:
    image: thuang6413/moosic-backend:3.3
    container_name: moosic-backend
    env_file:
      - docker-compose.env
    ports:
      - "5000:5000"
    networks:
      - moosic-network
    restart: unless-stopped

  frontend:
    image: thuang6413/moosic-frontend:3.2
    container_name: moosic-frontend
    ports:
      - "3000:3000"
    networks:
      - moosic-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  moosic-network:
    driver: bridge
